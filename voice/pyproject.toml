[tool.poetry]
name = "home-ai-voice"
version = "0.1.0"
description = "Home AI Voice Service - Wake Word + STT + LLM"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
openwakeword = ">=0.4.0"
onnxruntime = "*"
numpy = "*"
